  --k-dialogue_order:#A44BD6; --k-matching:#4F46E5; --k-categorization:#A5701A; --k-word_transform:#C026D3; --k-cards:#4F73A8; --on-k:#FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root[data-preset="kids"]:not([data-theme="light"]) {
    --bg:#1B2257; --bg-alt:#232C6B; --surface:#2B3578; --border:#4553A8; --ink:#FFFFFF; --body:#E4E8FF; --muted:#B9C2F2;
    --primary:#FFA04D; --primary-strong:#FFC08A; --primary-tint:#4A3F6E; --on-primary:#2B1600; --accent:#A78BFF; --on-accent:#1B1450;
    --green:#4CD98A; --yellow:#FFD166; --ok:#7FE0A8; --ok-bg:#1E4A3A; --bad:#FF9A94; --bad-bg:#5A2B3F; --warn:#FFD166; --honey-bg:#4A4220; --honey-ink:#FFD166;
    --shadow-ink:rgba(0, 0, 0, .45); --btn-edge:#11164A; color-scheme: dark;
    --k-short_answer:#FFA04D; --k-true_false:#A78BFF; --k-inline_choice:#6FB0FF; --k-fill_blanks:#FF7FB5; --k-sentence_builder:#4DD6E3;
    --k-dialogue_order:#D08CFF; --k-matching:#9A94FF; --k-categorization:#E2B766; --k-word_transform:#EE7DFF; --k-cards:#9FB8E0; --on-k:#1B2257;
  }
}
:root[data-preset="kids"][data-theme="dark"] {
  --bg:#1B2257; --bg-alt:#232C6B; --surface:#2B3578; --border:#4553A8; --ink:#FFFFFF; --body:#E4E8FF; --muted:#B9C2F2;
  --primary:#FFA04D; --primary-strong:#FFC08A; --primary-tint:#4A3F6E; --on-primary:#2B1600; --accent:#A78BFF; --on-accent:#1B1450;
  --green:#4CD98A; --yellow:#FFD166; --ok:#7FE0A8; --ok-bg:#1E4A3A; --bad:#FF9A94; --bad-bg:#5A2B3F; --warn:#FFD166; --honey-bg:#4A4220; --honey-ink:#FFD166;
  --shadow-ink:rgba(0, 0, 0, .45); --btn-edge:#11164A; color-scheme: dark;
  --k-short_answer:#FFA04D; --k-true_false:#A78BFF; --k-inline_choice:#6FB0FF; --k-fill_blanks:#FF7FB5; --k-sentence_builder:#4DD6E3;
  --k-dialogue_order:#D08CFF; --k-matching:#9A94FF; --k-categorization:#E2B766; --k-word_transform:#EE7DFF; --k-cards:#9FB8E0; --on-k:#1B2257;
}
:root[data-preset="kids"] {
  --radius:32px; --radius-ctl:999px; --radius-pill:999px; --border-w:2px; --chunk:4px; --rule-w:2px; --line-w:4px;
  --shadow-card:0 6px 0 color-mix(in srgb, var(--primary) 28%, transparent); --shadow-btn:0 5px 0 var(--btn-edge); --shadow-chip:none;
  --shadow-btn-primary:0 5px 0 var(--primary-strong); --shadow-lift:0 7px 0 var(--btn-edge); --shadow-press:0 1px 0 var(--btn-edge); --shadow-pop:0 8px 0 var(--btn-edge);
  --lift-t:translateY(-2px); --press-t:translateY(4px);
  --font-display:"Balsamiq Sans", "Comic Sans MS", "Segoe UI", system-ui, sans-serif; --font-body:Nunito, Montserrat, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display-weight:700; --display-tracking:0; --display-case:none; --fs:18px; --fw:600; --lh:1.6;
}

/* ===== base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body {
  position: relative; margin: 0; background: var(--page-bg); color: var(--body);
  font-family: var(--font-body); font-weight: var(--fw); font-size: var(--fs); line-height: var(--lh);
  overflow-wrap: break-word;
}
h1, h2 { font-family: var(--font-display); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); text-transform: var(--display-case); color: var(--ink); line-height: 1.2; overflow-wrap: anywhere; }
h1 { font-size: 1.5rem; margin: 0 0 12px; }
h2 { font-size: 1.2rem; margin: 24px 0 12px; }
h3, h4 { color: var(--ink); font-weight: 700; margin: 16px 0 8px; line-height: 1.3; }
h3 { font-size: 1.1rem; }
h4 { font-size: 1rem; }
p { margin: 0 0 12px; }
hr { border: 0; border-top: var(--border-w) solid var(--border); margin: 20px 0; }
.wrap { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 16px 16px 40px; }
.card { background: var(--surface); border: var(--border-w) solid var(--border); border-radius: var(--radius); padding: 18px; margin: 0 0 16px; }
.muted { color: var(--muted); font-size: .9rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.chip { display: inline-block; padding: 2px 12px; border: var(--border-w) solid var(--border); border-radius: var(--radius-pill); background: var(--bg-alt); color: var(--muted); font-size: .875rem; font-weight: 600; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 0 0 14px; }
.btn { min-height: 44px; padding: 8px 16px; border: var(--border-w) solid var(--border); border-radius: var(--radius-ctl); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-btn); font: inherit; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover:not(:disabled) { border-color: var(--primary); box-shadow: var(--shadow-lift); }
.btn:active:not(:disabled) { box-shadow: var(--shadow-press); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-btn-primary); }
.btn.primary:hover:not(:disabled) { background: var(--primary-strong); border-color: var(--primary-strong); box-shadow: var(--shadow-lift); }
.btn[aria-pressed="true"], .btn[aria-selected="true"] { background: var(--primary-tint); border-color: var(--primary); }
.btn.primary[aria-pressed="true"] { background: var(--primary-strong); color: var(--on-primary); }
.btn svg { flex: none; width: 18px; height: 18px; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
input[type="text"], select { min-height: 44px; max-width: 100%; padding: 6px 12px; font: inherit; font-weight: 700; color: var(--ink); background: var(--surface); border: var(--border-w) solid var(--border); border-radius: var(--radius-ctl); vertical-align: middle; }
input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--ring); }
input[type="text"]:disabled { opacity: 1; color: var(--ink); -webkit-text-fill-color: var(--ink); cursor: default; }
.blank { width: 9em; margin: 4px 2px; }
.rich > :last-child { margin-bottom: 0; }
.rich ul, .rich ol { margin: 0 0 12px; padding-left: 1.3em; }
.rich li { margin-bottom: 4px; }
.rich li::marker { color: var(--primary); font-weight: 700; }
.rich table { border-collapse: collapse; min-width: 100%; margin: 0 0 12px; }
.rich th, .rich td { border: var(--border-w) solid var(--border); padding: 7px 12px; text-align: left; }
.rich th { background: var(--primary-tint); color: var(--ink); font-weight: 700; }
.rich tbody tr:nth-child(even) td { background: var(--bg-alt); }
.rich blockquote { margin: 0 0 12px; padding: 4px 0 4px 16px; border-left: 4px solid var(--accent); color: var(--ink); font-style: italic; }
.rich code, code { background: var(--bg-alt); padding: 1px 6px; border-radius: 6px; font-size: .9em; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
.table-wrap { overflow-x: auto; margin: 0 0 12px; }
.hint { position: relative; display: flex; gap: 14px; align-items: flex-start; background: color-mix(in srgb, var(--accent) 16%, var(--surface)); border-left: 5px solid var(--accent); }
.hint p { margin: 0; color: var(--ink); }
.hint-ico { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--radius-pill); background: var(--accent); color: var(--on-accent); }
.hint-ico svg { width: 20px; height: 20px; }
.note { border: var(--border-w) dashed var(--primary); background: var(--bg-alt); }
.note .tag { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 8px; padding: 1px 10px 1px 8px; border-radius: var(--radius-pill); background: var(--primary); color: var(--on-primary); font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.note .tag svg { width: 14px; height: 14px; }
.note p { margin: 0; white-space: pre-wrap; }
.teacher-only { display: none; }
body.teacher .teacher-only { display: block; }
body.teacher .chip.teacher-only { display: inline-block; }
.answer-key { display: none; }
body.teacher .answer-key { display: block; }
.answer-key li { margin-bottom: 12px; }
.q-text, .instr { white-space: pre-wrap; }
.q-text { line-height: 2.3; color: var(--ink); }
.result { font-weight: 700; min-height: 1.55em; }
.result.ok, .mark.ok, .fix { color: var(--ok); }
.result.bad, .mark.bad { color: var(--bad); }
.mark { font-weight: 700; margin: 0 4px; }
.mark:empty { display: none; }
.fix { font-weight: 600; margin-left: 6px; }
.is-ok { border-color: var(--ok) !important; background: var(--ok-bg) !important; }
.is-bad { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
svg { display: block; }
.deco, .thread { display: none; }

/* ---- hero ---- */
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 36px; align-items: center; margin: 0 0 14px; padding: 30px 32px; background: var(--surface); border: var(--border-w) solid var(--card-edge); border-radius: calc(var(--radius) + 4px); box-shadow: var(--shadow-card); }
.hero-text { min-width: 0; }
.hero h1 { margin: 0 0 16px; font-size: clamp(1.7rem, 5.4vw, 2.9rem); line-height: 1.1; }
.goal { max-width: 46ch; margin: 0; font-size: 1.05em; color: var(--body); }
.hero-art { justify-self: end; width: min(100%, 320px); }
.cover { width: 100%; max-width: 100%; height: auto; }
.cover .fp { fill: var(--primary); } .cover .ft { fill: var(--primary-tint); } .cover .fa { fill: var(--accent); }
.cover .fb { fill: var(--border); } .cover .fi { fill: var(--ink); } .cover .nf { fill: none; }
.cover .sp, .cover .sa, .cover .sb, .cover .si, .cover .st { stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.cover .sp { stroke: var(--primary); } .cover .sa { stroke: var(--accent); } .cover .sb { stroke: var(--border); }
.cover .si { stroke: var(--ink); } .cover .st { stroke: var(--primary-tint); }
.cover .w2 { stroke-width: 2; } .cover .w4 { stroke-width: 4; } .cover .w5 { stroke-width: 5; } .cover .w6 { stroke-width: 6; }
.cover .w8 { stroke-width: 8; } .cover .w12 { stroke-width: 12; } .cover .dsh { stroke-dasharray: 2 7; }
.progress { position: relative; margin-top: 18px; max-width: 46ch; }
.pbar { height: 8px; border-radius: var(--radius-pill); background: var(--border); overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: var(--radius-pill); background: var(--primary); transform: scaleX(0); transform-origin: left center; }
.progress .muted { margin: 8px 0 0; }
.alldone { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; color: var(--ok); font-weight: 700; }
.alldone svg { flex: none; width: 20px; height: 20px; }
.tb { padding-inline: 12px; font-size: .9rem; }

/* ---- stages ---- */
.stage { position: relative; min-width: 0; scroll-margin-top: 64px; }
h2.sec { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 38px 0 16px; font-size: 1.25rem; }
.stage:first-of-type h2.sec { margin-top: 12px; }
.secno { flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--radius-ctl); background: var(--primary-tint); color: var(--primary-strong); font: 700 .85rem var(--font-body); letter-spacing: 0; }
.sect { min-width: 0; }
h2.sec .chip { font-family: var(--font-body); letter-spacing: 0; text-transform: none; }

/* ---- sticky stage bar ---- */
.stagebar { position: fixed; z-index: 40; left: 0; right: 0; top: 0; background: color-mix(in srgb, var(--bg) 97%, transparent); border-bottom: var(--border-w) solid var(--border); }
.stagebar-in { display: flex; align-items: center; gap: 14px; max-width: 820px; height: 48px; margin: 0 auto; padding: 0 16px; }
.sgs { display: flex; flex: 1 1 auto; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.sgs::-webkit-scrollbar { display: none; }
.sg { flex: 1 1 0; min-width: 44px; height: 44px; padding: 0 2px; border: 0; background: none; color: var(--ink); cursor: pointer; display: grid; align-items: center; }
.sg-t { position: relative; display: block; height: 8px; border-radius: var(--radius-pill); background: var(--border); overflow: hidden; }
.sg-t i { display: block; width: 100%; height: 100%; border-radius: var(--radius-pill); background: var(--primary); transform: scaleX(0); transform-origin: left center; }
.sg[aria-current="step"] .sg-t { height: 12px; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.sg:focus-visible { outline-offset: -2px; }
.stagebar-txt { flex: none; display: none; color: var(--muted); font-size: .85rem; font-weight: 700; white-space: nowrap; }

/* ---- task shell ---- */
.practice { --k: var(--primary); }
.practice[data-task-type="short_answer"] { --k: var(--k-short_answer); }
.practice[data-task-type="true_false"] { --k: var(--k-true_false); }
.practice[data-task-type="inline_choice"] { --k: var(--k-inline_choice); }
.practice[data-task-type="fill_blanks"] { --k: var(--k-fill_blanks); }
.practice[data-task-type="sentence_builder"] { --k: var(--k-sentence_builder); }
.practice[data-task-type="dialogue_order"] { --k: var(--k-dialogue_order); }
.practice[data-task-type="matching"] { --k: var(--k-matching); }
.practice[data-task-type="categorization"] { --k: var(--k-categorization); }
.practice[data-task-type="word_transform"] { --k: var(--k-word_transform); }
.practice[data-task-type="cards"] { --k: var(--k-cards); }
.hwp { --pad-x: 22px; position: relative; display: grid; gap: 14px; padding: 20px var(--pad-x) 18px; border: var(--border-w) solid var(--card-edge); border-top: var(--rule-w) solid var(--k); border-radius: var(--radius); box-shadow: var(--shadow-card); min-width: 0; }
.hwp__head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.kind, .pts { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; border-radius: var(--radius-pill); font-weight: 700; }
.kind { padding: 0 12px 0 9px; background: color-mix(in srgb, var(--k) 14%, var(--surface)); color: color-mix(in srgb, var(--k) 68%, var(--ink)); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.kind svg { color: var(--k); }
.pts { padding: 0 12px 0 9px; background: var(--honey-bg); color: var(--honey-ink); font-size: 12px; }
.kind svg, .pts svg { flex: none; width: 14px; height: 14px; }
.hwp h3.p-title { margin: 0; font-size: 1.25rem; }
.hwp .instr { margin: -6px 0 0; font-size: .92rem; }
.hwp__stage { display: grid; gap: 14px; min-width: 0; }
.foot { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding-top: 4px; }
.foot .hwp__check { min-height: 46px; padding-inline: 26px; border-radius: var(--radius-pill); font-size: .95rem; }
.foot .btn:not(.hwp__check) { border-radius: var(--radius-pill); }
.confetti { position: absolute; width: 0; height: 0; pointer-events: none; z-index: 6; }
.confetti i { position: absolute; left: -4px; top: -6px; width: 8px; height: 12px; border-radius: 2px; background: var(--c); }
.confetti i:nth-child(3n + 1) { --c: var(--primary); }
.confetti i:nth-child(3n + 2) { --c: var(--accent); }
.confetti i:nth-child(3n) { --c: var(--ok); width: 7px; height: 7px; border-radius: 50%; }

/* ---- true / false ---- */
.tf-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; margin-bottom: 10px; border: var(--border-w) solid var(--border); border-radius: var(--radius-in); background: var(--surface); }
.tf-row:last-child { margin-bottom: 0; }
.tf-text { flex: 1 1 220px; min-width: 0; color: var(--ink); font-weight: 700; }
.seg { display: inline-flex; gap: 3px; padding: 3px; border: var(--border-w) solid var(--border); border-radius: var(--radius-pill); background: var(--bg-alt); }
.segb { min-width: 80px; min-height: 44px; padding: 0 22px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--ink); font: inherit; font-weight: 800; cursor: pointer; }
.segb:hover:not(:disabled):not([aria-pressed="true"]) { background: var(--primary-tint); }
.segb[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.segb:disabled { cursor: default; }
.segb:disabled:not([aria-pressed="true"]) { opacity: .6; }

/* ---- dropdown (inline_choice) and the look popover ---- */
.dd { display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; min-width: 8.5em; max-width: 100%; margin: 4px 2px; padding: 6px 12px; font: inherit; font-weight: 700; color: var(--ink); background: var(--surface); border: var(--border-w) solid var(--border); border-radius: var(--radius-ctl); box-shadow: var(--shadow-chip); cursor: pointer; vertical-align: middle; text-align: left; }
.dd:hover:not(:disabled) { border-color: var(--primary); }
.dd[aria-expanded="true"] { border-color: var(--primary); background: var(--primary-tint); }
.dd:disabled { cursor: default; }
.dd-val { min-height: 1.3em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd.is-empty .dd-val { color: var(--muted); font-weight: 500; }
.dd-chev { flex: none; width: 8px; height: 8px; margin-top: -4px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); }
.dd[aria-expanded="true"] .dd-chev { margin-top: 4px; border-color: var(--primary); transform: rotate(225deg); }
.dd-pop { position: fixed; z-index: 50; display: grid; gap: 2px; min-width: 160px; max-width: min(340px, calc(100vw - 16px)); max-height: min(360px, 60vh); overflow: auto; padding: 6px; background: var(--surface); border: var(--border-w) solid var(--border); border-radius: var(--radius-in); box-shadow: var(--shadow-pop); }
.dd-opt { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; min-height: 44px; padding: 8px 12px; border: 0; border-radius: calc(var(--radius-in) * .7); background: transparent; color: var(--ink); font: inherit; font-weight: 700; text-align: left; cursor: pointer; }
.dd-opt:hover, .dd-opt:focus-visible { background: var(--primary-tint); outline: none; }
.dd-opt[aria-selected="true"] { color: var(--primary-strong); }
.dd-opt[aria-selected="true"]::after { content: "\2713"; font-weight: 700; }
.look-opt { justify-content: flex-start; gap: 12px; }
.look-opt[aria-selected="true"]::after { margin-left: auto; }
.dots { display: inline-flex; flex: none; }
.dots i { width: 14px; height: 14px; margin-right: -4px; border: 2px solid var(--surface); border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px var(--border); }

/* ---- word transform ---- */
.wt-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px 12px; padding: 10px 14px; margin-bottom: 10px; border: var(--border-w) solid var(--border); border-radius: var(--radius-in); }
.wt-row:last-child { margin-bottom: 0; }
.wt-wrong { color: var(--honey-ink); font-weight: 700; text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--honey-ink) 55%, transparent); overflow-wrap: anywhere; }
.wt-arrow { width: 20px; height: 20px; color: var(--primary); }
.wt-ans { display: flex; align-items: center; min-width: 0; }
.wt-ans .blank { flex: 1 1 8em; width: auto; min-width: 0; margin: 0; }

/* ---- sentence builder (word rail) ---- */
.sb-row { display: grid; gap: 12px; padding: 4px 0 14px; }
.sb-row:last-child { padding-bottom: 0; }
.rail { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 62px; padding: 10px 12px 12px; border: 0; border-bottom: 2.5px dashed var(--dash); border-radius: var(--radius-in) var(--radius-in) 6px 6px; background: var(--primary-tint); }
.rail[data-complete] { border-bottom-style: solid; border-bottom-color: var(--primary); }
.rail.is-ok, .rail.is-bad { border-width: 0 0 2.5px 0; border-bottom-style: solid; }
.rail-hint { display: none; flex: 1; height: 0; border-top: 2px solid var(--dash); opacity: .7; }
.rail-hint:only-child { display: block; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.word { min-height: 44px; padding: 0 16px; border: var(--border-w) solid var(--border); border-bottom-width: calc(var(--border-w) + var(--chunk)); border-radius: var(--radius-ctl); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-chip); font: inherit; font-weight: 700; cursor: pointer; }
.word:disabled { cursor: default; }
.rail .word { border-color: var(--primary); color: var(--primary-strong); }
.ghost { display: inline-block; min-height: 44px; padding: 0 16px; line-height: 41px; border: var(--border-w) dashed var(--border); border-radius: var(--radius-ctl); background: var(--bg); color: transparent; font-weight: 700; user-select: none; }

/* ---- dialogue (chat) ---- */
.chat { position: relative; list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.crow { position: relative; display: flex; align-items: flex-end; gap: 8px; max-width: min(92%, 580px); }
.crow[data-side="right"] { justify-self: end; flex-direction: row-reverse; }
.avatar { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: var(--on-primary); font-size: .75rem; font-weight: 800; }
.crow[data-side="right"] .avatar { background: var(--accent); color: var(--on-accent); }
.bubble { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 6px 6px 6px 8px; border: var(--border-w) solid var(--border); border-radius: var(--radius-in) var(--radius-in) var(--radius-in) 6px; background: var(--surface); box-shadow: var(--shadow-chip); }
.crow[data-side="right"] .bubble { border-radius: var(--radius-in) var(--radius-in) 6px var(--radius-in); background: var(--primary-tint); }
.grip { flex: none; display: grid; place-items: center; width: 28px; height: 44px; color: var(--muted); cursor: grab; touch-action: none; user-select: none; }
.grip svg { width: 14px; height: 14px; }
.dlg-text { flex: 1 1 auto; min-width: 0; padding: 4px 2px; color: var(--ink); font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
.tools { display: inline-flex; flex: none; }
.tools .btn { min-width: 44px; padding: 4px; border-color: transparent; background: transparent; box-shadow: none; font-size: 1.05rem; }
.tools .btn:hover:not(:disabled) { background: var(--bg-alt); border-color: var(--border); box-shadow: none; }
.crow[data-dragging] { z-index: 4; }
.crow[data-dragging] .bubble { box-shadow: var(--shadow-lift); transform: rotate(-1.5deg); }
.crow[data-dragging] .grip { cursor: grabbing; }
.chat.is-ok, .chat.is-bad { border-color: transparent !important; background: none !important; }
.chat.is-ok .bubble { border-color: var(--ok); background: var(--ok-bg); }
.chat.is-bad .bubble { border-color: var(--bad); background: var(--bad-bg); }

/* ---- matching (lines) ---- */
.mboard { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) clamp(28px, 9vw, 72px) minmax(0, 1fr); align-items: start; }
.mcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mcol:first-child { grid-column: 1; }
.mcol:nth-child(2) { grid-column: 3; }
.mhead { padding-left: 4px; color: var(--muted); font-size: .7rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.mtile { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 52px; padding: 8px 14px; border: var(--border-w) solid var(--border); border-bottom-width: calc(var(--border-w) + var(--chunk)); border-radius: var(--radius-in); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-chip); font: inherit; font-weight: 700; line-height: 1.3; text-align: left; cursor: pointer; }
.mtile:disabled { cursor: default; }
.mtile[aria-pressed="true"] { border-color: var(--primary); box-shadow: var(--shadow-chip), 0 0 0 4px var(--ring); }
.mtile[data-c] { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 9%, var(--surface)); }
.mtile[data-c="0"] { --pc: var(--c0); } .mtile[data-c="1"] { --pc: var(--c1); } .mtile[data-c="2"] { --pc: var(--c2); } .mtile[data-c="3"] { --pc: var(--c3); }
.mtext { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.mtile .mark { flex: none; margin: 0; }
.mdot { position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px; border: 2px solid var(--border); border-radius: 50%; background: var(--surface); }
.mtile[data-side="l"] .mdot { right: -7px; }
.mtile[data-side="r"] .mdot { left: -7px; }
.mtile[data-c] .mdot { border-color: var(--pc); background: var(--pc); }
.badge { display: none; flex: none; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 11px; background: var(--primary); color: var(--on-primary); font-size: .75rem; line-height: 22px; text-align: center; }
.mlines { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.mline { fill: none; stroke: var(--pc, var(--primary)); stroke-width: var(--line-w); stroke-linecap: round; }
.mline[data-c="0"] { --pc: var(--c0); } .mline[data-c="1"] { --pc: var(--c1); } .mline[data-c="2"] { --pc: var(--c2); } .mline[data-c="3"] { --pc: var(--c3); }
.mline[data-r] { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; }
.mline[data-r="ok"] { stroke: var(--ok); }
.mline[data-r="bad"] { stroke: var(--bad); stroke-linecap: butt; stroke-dasharray: 9 6; }
.mline.mshow { stroke: var(--ok); stroke-width: 2; stroke-dasharray: 2 6; }
.mtile.is-ok .mdot { border-color: var(--ok); background: var(--ok); }
.mtile.is-bad .mdot { border-color: var(--bad); background: var(--bad); }
.mline.mprev { stroke: var(--primary); stroke-width: 2.5; stroke-dasharray: 5 6; opacity: .7; }

/* ---- categorization boards ---- */
.cat { display: grid; gap: 14px; min-width: 0; }
.pool { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px; min-height: 60px; padding: 12px; border: var(--border-w) dashed var(--dash); border-radius: var(--radius-in); background: var(--bg); }
.pool:empty { align-items: center; justify-content: center; color: var(--ok); }
.pool:empty::after { content: "\2713"; font-weight: 700; }
.boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.board { --bc: var(--c0); display: grid; align-content: start; gap: 8px; min-width: 0; min-height: 120px; padding: 8px; border: var(--border-w) solid color-mix(in srgb, var(--bc) 38%, var(--border)); border-radius: var(--radius-in); background: color-mix(in srgb, var(--bc) 7%, var(--surface)); }
.board[data-c="1"] { --bc: var(--c1); } .board[data-c="2"] { --bc: var(--c2); } .board[data-c="3"] { --bc: var(--c3); } .board[data-c="4"] { --bc: var(--c4); }
.board[data-over] { border-style: dashed; border-color: var(--bc); }
.bhead { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 8px; border: 0; border-radius: calc(var(--radius-in) * .7); background: transparent; color: var(--ink); font: inherit; font-weight: 800; text-align: left; cursor: pointer; }
.cat.armed .bhead { background: color-mix(in srgb, var(--bc) 14%, transparent); }
.bhead:disabled { cursor: default; }
.sw { flex: none; width: 12px; height: 12px; border-radius: 4px; background: var(--bc); }
.bt { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.cnt { flex: none; min-width: 26px; padding: 1px 8px; border-radius: var(--radius-pill); background: var(--surface); color: var(--muted); font-size: .75rem; text-align: center; }
.bbody { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; }
.cwrap { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; max-width: 100%; }
.cwrap .mark { margin: 0 2px; font-size: .85rem; }
.cwrap .fix { margin-left: 4px; }
.cchip { max-width: 100%; min-height: 44px; padding: 0 14px; border: var(--border-w) solid var(--border); border-bottom-width: calc(var(--border-w) + var(--chunk)); border-radius: var(--radius-ctl); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-chip); font: inherit; font-size: .9rem; font-weight: 700; cursor: pointer; touch-action: none; overflow-wrap: anywhere; }
.cchip:disabled { cursor: default; }
.cchip[aria-pressed="true"] { border-color: var(--primary); box-shadow: var(--shadow-chip), 0 0 0 4px var(--ring); transform: translateY(-3px) rotate(-2deg); }
.cwrap[data-dragging] { position: relative; z-index: 20; }
.cwrap[data-dragging] .cchip { box-shadow: var(--shadow-lift); }

/* ---- cards (3D flip) ---- */
.cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.c3 { position: relative; display: block; width: 100%; padding: 0; border: 0; background: none; font: inherit; perspective: 1100px; cursor: pointer; text-align: center; }
.c3:focus-visible { border-radius: var(--radius-in); }
.c3-in { display: grid; min-height: 112px; transform-style: preserve-3d; }
.c3[aria-pressed="true"] .c3-in { transform: rotateY(180deg); }
.c3-face { grid-area: 1 / 1; display: grid; place-content: center; gap: 6px; padding: 14px; border: var(--border-w) solid var(--border); border-bottom-width: calc(var(--border-w) + var(--chunk)); border-radius: var(--radius-in); background: var(--surface); box-shadow: var(--shadow-chip); backface-visibility: hidden; -webkit-backface-visibility: hidden; color: var(--ink); font-size: 1.05rem; font-weight: 700; white-space: pre-wrap; overflow-wrap: anywhere; }
.c3-back { transform: rotateY(180deg); background: var(--primary-tint); border-color: var(--dash); }
.c3-hint { color: var(--muted); font-size: .75rem; font-weight: 500; }
.c3-big { width: min(100%, 420px); margin: 0 auto 12px; }
.c3-big .c3-in { min-height: 190px; }
.c3-big .c3-face { font-size: 1.4rem; }

/* ---- tabs, quiz, game ---- */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.q-front { font-size: 1.3rem; font-weight: 800; color: var(--ink); margin: 0 0 12px; }
.opts { display: grid; gap: 8px; }
.opts .btn { justify-content: flex-start; text-align: left; }
.plan-list { margin: 0; padding-left: 20px; }
.plan-list li { margin-bottom: 14px; }
.plan-list code { display: inline-block; margin: 4px 8px 4px 0; white-space: normal; }
.savebar { margin: 28px 0 8px; }

/* ---- finale: test result and the lesson completion screen share one card ---- */
.finale { position: relative; margin-top: 28px; text-align: left; }
.res { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; margin-top: 16px; }
.finale .res { margin-top: 0; }
.finale > .btn { margin-bottom: 16px; }
.res h2 { margin: 0 0 6px; }
.finale h2 { font-size: clamp(1.7rem, 4.6vw, 2.3rem); }
.fin-text { flex: 1 1 220px; min-width: 0; }
.fin-text .btn { margin-top: 10px; }
.ring-w { position: relative; flex: none; width: 128px; height: 128px; }
.ring { width: 100%; height: 100%; }
.ring-t { stroke: var(--border); }
.ring-p.ok { stroke: var(--ok); } .ring-p.bad { stroke: var(--bad); }
.ring-n { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink); font: var(--display-weight) 1.5rem var(--font-display); }

/* ---- motion ---- */
@media (prefers-reduced-motion: no-preference) {
  @keyframes hwp-rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes hwp-pop { from { opacity: 0; transform: scale(.85); } }
  @keyframes hwp-bump { 0% { transform: scale(.96); } 55% { transform: scale(1.035); } 100% { transform: scale(1); } }
  @keyframes hwp-nudge { 20% { transform: translateX(-5px); } 45% { transform: translateX(4px); } 70% { transform: translateX(-2px); } }
  @keyframes hwp-draw { to { stroke-dashoffset: 0; } }
  @keyframes hwp-burst {
    from { opacity: 1; transform: translate(0, 0) rotate(0) scale(.5); }
    45% { opacity: 1; transform: translate(calc(var(--dx) * .8), var(--dy)) rotate(calc(var(--rot) * .6)) scale(1); }
    to { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 70px)) rotate(var(--rot)) scale(.9); }
  }
  @keyframes cv-in { from { opacity: 0; transform: translateY(8px); } }
  @keyframes ring-in { from { stroke-dashoffset: var(--c); } }
  @keyframes fade-up { from { opacity: 0; transform: translateY(6px); } }
  @keyframes card-next { from { opacity: 0; transform: translateX(28px) rotate(2deg); } }
  @keyframes card-prev { from { opacity: 0; transform: translateX(-28px) rotate(-2deg); } }
  @keyframes dd-in { from { opacity: 0; transform: translateY(-4px); } }
  @keyframes bar-in { from { opacity: 0; transform: translateY(-100%); } }
  .dd-chev { transition: transform .18s; }
  .dd-pop { animation: dd-in .14s ease-out; }
  .stagebar { animation: bar-in .3s var(--ease); }
  .rise-go { animation: hwp-rise 520ms var(--ease) backwards; }
  .pop { animation: hwp-bump 380ms var(--ease); }
  .nudge { animation: hwp-nudge 480ms var(--ease); }
  .mark.ok, .mark.bad, .fix { animation: hwp-pop 360ms var(--ease) backwards; }
  .cover .cv { animation: cv-in 560ms var(--ease) backwards; animation-delay: calc(var(--i) * 60ms); }
  .pbar i, .sg-t i { transition: transform .6s var(--ease); }
  .alldone { animation: hwp-pop 420ms var(--ease) backwards; }
  .finale { animation: hwp-rise 520ms var(--ease) backwards; }
  .confetti i { animation: hwp-burst 1000ms var(--ease) forwards; }
  .btn, .word, .mtile, .cchip, .c3, .segb, .dd { transition: transform 240ms var(--ease); }
  .btn:not(:disabled):hover, .word:not(:disabled):hover, .mtile:not(:disabled):hover, .cchip:not(:disabled):hover, .dd:not(:disabled):hover { transform: var(--lift-t); }
  .btn:not(:disabled):active, .word:not(:disabled):active, .mtile:not(:disabled):active, .cchip:not(:disabled):active, .dd:not(:disabled):active { transform: var(--press-t); }
  .tools .btn:not(:disabled):hover { transform: none; }
  .segb[aria-pressed="true"] { transform: scale(1.03); }
  .mline.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: hwp-draw 520ms var(--ease) forwards; }
  .c3-in { transition: transform 620ms var(--ease); }
  .c3[data-dir="next"] .c3-in { animation: card-next 420ms var(--ease); }
  .c3[data-dir="prev"] .c3-in { animation: card-prev 420ms var(--ease); }
  .ring-p { animation: ring-in 1000ms var(--ease) backwards; }
  .res-line { animation: fade-up 400ms var(--ease) 900ms backwards; }
}
@media screen and (prefers-reduced-motion: no-preference) {
  .rise-wait { opacity: 0; transform: translateY(10px); }
}
@media (prefers-reduced-motion: reduce) {
  .c3[aria-pressed="true"] .c3-in { transform: none; }
  .c3-back { transform: none; }
  .c3[aria-pressed="true"] .c3-face:not(.c3-back), .c3:not([aria-pressed="true"]) .c3-back { visibility: hidden; }
  .pbar i, .sg-t i { transition: none; }
}
@media (pointer: coarse) { .mtile { min-height: 54px; } }
@media (min-width: 640px) { .stagebar-txt { display: block; } }
@media (max-width: 640px) {
  .hero { grid-template-columns: minmax(0, 1fr); padding: 22px 20px; }
  .hero-art { justify-self: start; width: min(100%, 260px); }
  .wt-row { grid-template-columns: minmax(0, 1fr); }
  .wt-arrow { display: none; }
  .seg { width: 100%; }
  .segb { flex: 1 1 0; min-width: 0; }
  .boards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bhead { flex-wrap: wrap; padding: 6px 8px; }
  .bhead .bt { order: 3; flex-basis: 100%; overflow-wrap: break-word; }
  .bhead .cnt { margin-left: auto; }
}
@media (max-width: 480px) {
  .wrap { padding: 12px 12px 32px; }
  .card { padding: 14px; }
  .hero { padding: 20px 16px; }
  .hwp { --pad-x: 14px; padding: 16px var(--pad-x) 14px; }
  .mtile { padding: 8px 10px; font-size: .9rem; }
  .mboard { grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr); }
  .crow { max-width: 100%; }
  .blank { width: 7.5em; }
  .res { gap: 8px 16px; }
  .stagebar-in { padding: 0 12px; }
  .tb { padding-inline: 12px; }
}

/* ===== presets: the signature of each look (everything else is tokens) ===== */

/* ---- mimiao: the berry thread ---- */
[data-preset="mimiao"] .hero { background: radial-gradient(520px 260px at 100% 0, color-mix(in srgb, var(--primary) 9%, var(--surface)), transparent 70%), var(--surface); }
[data-preset="mimiao"] .hero-art { border-radius: 22px; box-shadow: var(--shadow-lift); }
[data-preset="mimiao"] .hero-art .cover { border-radius: 22px; }
[data-preset="mimiao"] .chip { background: var(--primary-tint); border-color: transparent; color: var(--primary-strong); }
[data-preset="mimiao"] main { position: relative; }
[data-preset="mimiao"] .finale { background: linear-gradient(135deg, var(--primary-tint), var(--surface) 65%); }
@media (min-width: 1100px) {
  [data-preset="mimiao"] .thread { display: block; position: absolute; left: -90px; top: 0; width: 80px; height: 100%; overflow: visible; pointer-events: none; }
  [data-preset="mimiao"] .thread path { fill: none; stroke: var(--primary); stroke-width: 1.5; stroke-linecap: round; opacity: .75; }
  [data-preset="mimiao"] .secno { position: absolute; z-index: 1; left: -64px; top: 50%; margin-top: -17px; border: 1.5px solid var(--primary); border-radius: 50%; background: var(--surface); color: var(--primary-strong); }
}

/* ---- pop: neo-brutalist ---- */
[data-preset="pop"] .hero { padding: 34px; background: var(--primary); color: var(--on-primary); box-shadow: 8px 8px 0 var(--hard); }
[data-preset="pop"] .hero h1 { color: var(--on-primary); font-size: clamp(1.6rem, 5vw, 2.4rem); line-height: 1.06; }
[data-preset="pop"] .hero .goal, [data-preset="pop"] .hero .progress .muted { color: var(--on-primary); font-weight: 700; }
[data-preset="pop"] .hero .chip { background: var(--pop-3); border-color: var(--border); color: #000; font-weight: 800; box-shadow: var(--shadow-chip); }
[data-preset="pop"] .hero .chip:nth-child(3n + 2) { background: var(--pop-4); }
[data-preset="pop"] .hero .chip:nth-child(3n) { background: var(--accent); color: var(--on-accent); }
[data-preset="pop"] .hero-art { width: min(100%, 280px); padding: 10px; border: 3px solid var(--border); border-radius: 10px; background: var(--surface); box-shadow: 6px 6px 0 var(--hard); transform: rotate(-3deg); }
[data-preset="pop"] .hero-art .cover { border-radius: 4px; }
[data-preset="pop"] .pbar { height: 14px; border: 3px solid var(--border); background: var(--surface); }
[data-preset="pop"] .pbar i { background: var(--accent); }
[data-preset="pop"] .btn.primary { border-color: var(--border); }
[data-preset="pop"] .btn.primary:hover:not(:disabled) { border-color: var(--border); }
[data-preset="pop"] .btn[aria-pressed="true"], [data-preset="pop"] .btn[aria-selected="true"] { background: var(--pop-3); border-color: var(--border); color: #000; }
[data-preset="pop"] .btn.primary[aria-pressed="true"] { background: var(--primary-strong); color: var(--on-primary); }
[data-preset="pop"] .hwp { padding-top: 0; }
[data-preset="pop"] .hwp__head { margin: 0 calc(var(--pad-x) * -1); padding: 10px var(--pad-x); background: var(--k); border-bottom: 3px solid var(--border); border-radius: 6px 6px 0 0; }
[data-preset="pop"] .kind { background: var(--surface); border: 3px solid var(--border); color: var(--ink); font-weight: 800; }
[data-preset="pop"] .kind svg { color: var(--ink); }
[data-preset="pop"] .pts { background: var(--pop-3); border: 3px solid var(--border); color: #000; }
[data-preset="pop"] h2.sec { padding: 10px 14px; border: 3px solid var(--border); border-radius: 10px; background: var(--primary); color: var(--on-primary); box-shadow: 5px 5px 0 var(--hard); }
[data-preset="pop"] .stage[data-band="1"] h2.sec { background: var(--accent); color: var(--on-accent); }
[data-preset="pop"] .stage[data-band="2"] h2.sec { background: var(--pop-3); color: #000; }
[data-preset="pop"] .stage[data-band="3"] h2.sec { background: var(--pop-4); color: #000; }
[data-preset="pop"] .secno { width: 38px; height: 38px; border: 3px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); font-weight: 800; }
[data-preset="pop"] h2.sec .chip { background: var(--surface); color: var(--ink); border-color: var(--border); }
[data-preset="pop"] .hint { border-left-width: 3px; border-left-color: var(--border); background: color-mix(in srgb, var(--pop-3) 38%, var(--surface)); }
[data-preset="pop"] .hint-ico { background: var(--pop-3); border: 3px solid var(--border); color: #000; border-radius: 8px; }
[data-preset="pop"] .note .tag { border: 2px solid var(--border); }
[data-preset="pop"] .rich th { background: var(--pop-3); color: #000; }
[data-preset="pop"] .rich blockquote { border-left-width: 6px; border-left-color: var(--accent); }
[data-preset="pop"] .rail { border-width: 3px; border-style: dashed; border-color: var(--border); border-radius: var(--radius-in); }
[data-preset="pop"] .rail[data-complete] { border-style: solid; }
[data-preset="pop"] .rail.is-ok, [data-preset="pop"] .rail.is-bad { border-width: 3px; border-style: solid; }
[data-preset="pop"] .mdot { border-color: var(--border); background: var(--pop-3); }
[data-preset="pop"] .stagebar { background: var(--bg); border-bottom-width: 3px; }
[data-preset="pop"] .sg-t { height: 16px; border: 3px solid var(--border); background: var(--surface); }
[data-preset="pop"] .sg[aria-current="step"] .sg-t { height: 16px; box-shadow: 3px 3px 0 var(--hard); }
[data-preset="pop"] .sg-t i { background: var(--accent); }
[data-preset="pop"] .stagebar-txt { color: var(--ink); }
[data-preset="pop"] .finale { background: var(--pop-3); color: #000; box-shadow: 8px 8px 0 var(--hard); }
[data-preset="pop"] .finale h2, [data-preset="pop"] .finale .ring-n, [data-preset="pop"] .finale p { color: #000; }
[data-preset="pop"] .finale .ring-t { stroke: rgba(0, 0, 0, .22); }
[data-preset="pop"] .finale .ring-p.ok { stroke: #000; }
[data-preset="pop"] .finale .btn { background: var(--surface); color: var(--ink); }

/* ---- editorial: magazine ---- */
[data-preset="editorial"] .hero { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-items: start; gap: 18px 40px; padding: 26px 0 30px; border: 0; border-top: 4px double var(--ink); border-bottom: 4px double var(--ink); border-radius: 0; background: none; box-shadow: none; }
[data-preset="editorial"] .hero-text { display: flex; flex-direction: column; }
[data-preset="editorial"] .hero h1 { margin: 0 0 18px; font-size: clamp(2.3rem, 6.8vw, 3.8rem); font-weight: 900; line-height: 1.04; letter-spacing: -.02em; }

  h2.sec { display: flex !important; margin: 16px 0 8px !important; padding: 0 !important; border: 0 !important; border-bottom: 1px solid #000 !important; border-radius: 0 !important; font-size: 14pt !important; font-variant: normal !important; }

  .stage > :not(h2.sec) { margin-left: 0 !important; }
  .chip { border: 1px solid #888 !important; border-radius: 999px !important; padding: 0 8px !important; font-size: 9pt !important; font-variant: normal !important; }

    add(panel, k.el, count, add(h('div', 'row'), prev, flip, next)); draw();
  }
  function gamePairsPanel(panel, cards) {
    var ord = order(cards.map(function (c) { return c.front; }), 'pairs'), rounds = [], r = 0;
    for (var k = 0; k < ord.length; k += 6) rounds.push(ord.slice(k, k + 6));
    function show() {
      var set = rounds[r].map(function (i) { return cards[i]; });
      var board = matchBoard(null, set.map(function (c) { return c.front; }),
        set.map(function (c) { return c.back; }), 'pair' + r);
      var res = h('span', 'result'), box = h('div', 'row'), next = btn(lab('next'), 'btn primary', function () { r++; show(); });
      var chk = btn(lab('check'), 'btn primary', function () {
        var good = 0;
        board.items.forEach(function (it) { var ok = !!it.test(); if (ok) good++; paint(it, ok, true); });
        board.after(true);
        res.className = 'result ' + (good === set.length ? 'ok' : 'bad');
        res.textContent = lab(good === set.length ? 'correct' : 'wrong') + ' ' + good + '/' + set.length;
        next.hidden = r >= rounds.length - 1;
      });
      res.setAttribute('aria-live', 'polite'); next.hidden = true;
      panel.textContent = '';
      add(panel, h('p', 'muted', (r + 1) + ' / ' + rounds.length), board.body, add(box, chk, next, res));
    }

  }
  function gameQuizPanel(panel, cards) {
    var fronts = cards.map(function (c) { return c.front; });
    deck(panel, order(fronts, 'quiz'), function (card, pos, done) {
      var box = h('div'), opts = h('div', 'opts'), correct = card.back, pool = [], seen = Object.create(null);
      seen[correct] = true;
      cards.forEach(function (c) { if (!seen[c.back]) { seen[c.back] = true; pool.push(c.back); } });
      var pick = order(pool, 'd' + pos + card.front).slice(0, 3).map(function (i) { return pool[i]; });
      var all = [correct].concat(pick), shown = order(all, 'o' + pos + card.front).map(function (i) { return all[i]; }), buttons = [];
      add(box, h('p', 'q-front', card.front), opts);
      shown.forEach(function (text) {
        var b = btn(text, 'btn', function () {
          var ok = text === correct;
          buttons.forEach(function (x) { x.b.disabled = true; if (x.t === correct) x.b.classList.add('is-ok'); });
          b.classList.add(ok ? 'is-ok' : 'is-bad'); b.classList.add(ok ? 'pop' : 'nudge');
          buttons.forEach(function (x) {
            if (x.t === correct || x.b === b) add(x.b, h('span', 'mark ' + (x.t === correct ? 'ok' : 'bad'), x.t === correct ? '✓' : '✗'));

    }, cards);
  }
  function gameWritePanel(panel, cards) {
    var fronts = cards.map(function (c) { return c.front; });

  function renderGame(main) {

    });
    main.appendChild(tabs); panels.forEach(function (p) { main.appendChild(p); }); select(start, false);
  }

  // ---------- course plan ----------
  function renderPlan(main) {
    pkg.plan.weeks.forEach(function (w) {
      var card = h('section', 'card'), list = h('ul', 'plan-list');
      card.appendChild(h('h2', '', lab('week') + ' ' + w.week + ': ' + w.theme));
      w.lessons.forEach(function (ls, j) {
        var li = h('li');
        add(li, h('span', 'muted', lab('lesson') + ' ' + (j + 1) + '. '), h('strong', '', ls.title), h('div', '', lab('goal') + ': ' + ls.goal));
        if (ls.homework) li.appendChild(h('div', '', lab('homework') + ': ' + ls.homework));
        if (ls.prompt) {
          var code = h('code', '', ls.prompt), cp = btn(lab('copyPrompt'), 'btn no-print');
          cp.addEventListener('click', function () {
            try {
              navigator.clipboard.writeText(ls.prompt).then(function () {
                cp.textContent = lab('copied');
                setTimeout(function () { cp.textContent = lab('copyPrompt'); }, 2000);
              }, function () {});
            } catch (e) { /* clipboard unavailable */ }

          add(li, h('div', '', ''), code, cp);
        }
        list.appendChild(li);

      card.appendChild(list); main.appendChild(rise(card));

  // ---------- page ----------
  function store(key, val) {
    try {
      if (val === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, val);
    } catch (e) { /* storage unavailable */ }
    return null;
  }
  function setTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    store('mk-theme', mode);
  }
  function isDark() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t === 'dark';
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function printAs(mode) { document.body.dataset.print = mode; window.print(); }

  // ---------- look: colours, fonts, presets ----------
  function luminance(hex) {
    var c = [1, 3, 5].map(function (i) {
      var v = parseInt(hex.slice(i, i + 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function readable(hex) { // white or near-black, whichever reads better on this colour
    var l = luminance(hex);
    return 1.05 / (l + 0.05) >= (l + 0.05) / 0.0589 ? '#FFFFFF' : '#1A1424';
  }
  // style.primary / style.accent override the preset's colours; strong and tint are derived so every preset and theme still harmonises.
  function applyColours(st) {
    var root = document.documentElement.style;
    if (typeof st.primary === 'string' && HEX.test(st.primary)) {
      root.setProperty('--primary', st.primary);
      root.setProperty('--primary-strong', 'color-mix(in srgb, ' + st.primary + ' 76%, var(--ink))');
      root.setProperty('--primary-tint', 'color-mix(in srgb, ' + st.primary + ' 11%, var(--surface))');
      root.setProperty('--on-primary', readable(st.primary));
    }
    if (typeof st.accent === 'string' && HEX.test(st.accent)) {
      root.setProperty('--accent', st.accent);
      root.setProperty('--on-accent', readable(st.accent));
    }
  }
  // Only the active preset's font stylesheet is loaded: one <link id="kit-fonts">, re-pointed on every switch. System fallbacks cover offline use.
  function loadFonts(name) {
    var link = document.getElementById('kit-fonts'), href = FONT_URL + PRESETS[name].fonts + '&display=swap';
    if (!link) {
      link = document.createElement('link');
      link.id = 'kit-fonts'; link.rel = 'stylesheet';
      document.head.appendChild(link);
    }
    if (link.getAttribute('href') !== href) {
      link.onload = settle;
      link.setAttribute('href', href);
    }
  }
  // The berry thread: one thin curve through the stage markers (mimiao, wide screens; hidden by CSS elsewhere).
  function drawThread() {
    if (!threadEl || !mainEl) return;
    var path = threadEl.firstChild, mr = mainEl.getBoundingClientRect(), pts = [];
    [].forEach.call(mainEl.querySelectorAll('h2.sec .secno'), function (n) {
      var r = n.getBoundingClientRect();
      pts.push({ x: r.left + r.width / 2 - mr.left + 90, y: r.top + r.height / 2 - mr.top });
    });
    if (pts.length < 2 || !mr.width) { path.setAttribute('d', ''); return; }
    var d = 'M ' + Math.round(pts[0].x) + ' ' + Math.round(pts[0].y);
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i], bow = i % 2 ? 30 : -30, dy = b.y - a.y;
      d += ' C ' + Math.round(a.x + bow) + ' ' + Math.round(a.y + dy * 0.3) + ', ' + Math.round(b.x - bow) + ' ' + Math.round(a.y + dy * 0.7) + ', ' + Math.round(b.x) + ' ' + Math.round(b.y);
    }
    path.setAttribute('d', d);
  }
  // Re-measure everything that depends on layout (matching lines, the thread); called after a look change and once fonts settle.
  function relayoutAll() {
    relayouts = relayouts.filter(function (r) { return r.el.isConnected; });
    relayouts.forEach(function (r) { r.fn(); });
    drawThread();
    stageScroll();
  }
  function settle() {
    relayoutAll();
    requestAnimationFrame(relayoutAll);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayoutAll);
  }
  function setPreset(name, persist) {
    if (!has(PRESETS, name)) name = 'mimiao';
    curPreset = name;
    document.documentElement.setAttribute('data-preset', name);
    loadFonts(name);
    if (themeBtn) themeBtn.hidden = name === 'night'; // night is dark by design; the toggle would do nothing
    if (persist) store('mk-look:' + pkg.title, name);
    settle();
  }
  function openLook(trigger) {
    closeDd(false);
    var pop = h('div', 'dd-pop');
    pop.setAttribute('role', 'listbox'); pop.setAttribute('aria-label', lab('look'));
    PRESET_ORDER.forEach(function (name) {
      var o = btn('', 'dd-opt look-opt'), dots = h('span', 'dots');
      o.setAttribute('role', 'option'); o.setAttribute('aria-selected', String(name === curPreset));
      PRESETS[name].dots.forEach(function (c) { var i = h('i'); i.style.setProperty('--c', c); dots.appendChild(i); });
      dots.setAttribute('aria-hidden', 'true');
      add(o, dots, h('span', '', lab(PRESETS[name].label)));
      o.addEventListener('click', function () { setPreset(name, true); closeDd(true); });
      pop.appendChild(o);
    });
    pop.addEventListener('keydown', listKeys);
    placePop(trigger, pop);
    (pop.querySelector('[aria-selected="true"]') || pop.firstChild).focus();
  }

  // ---------- page chrome ----------
  function tbtn(name, text, onClick) {
    var b = btn('', 'btn tb', onClick);
    return add(b, icon(name), h('span', '', text));
  }
  function renderHeader(wrap) {
    var head = h('header', 'hero'), txt = h('div', 'hero-text'), chips = h('div', 'chips');

    chips.appendChild(h('span', 'chip', pkg.subject));

    if (pkg.goal) txt.appendChild(h('p', 'goal', pkg.goal));

      var box = h('div', 'progress'), track = h('div', 'pbar'), fill = h('i');

      doneEl = h('p', 'alldone'); doneEl.hidden = true; barEl = fill;

    wrap.appendChild(head);

    var bar = h('div', 'toolbar'), tm = tbtn('teacher', lab('teacherMode')), th = tbtn('theme', lab('theme')), lk = tbtn('look', lab('look'));
    tm.setAttribute('aria-pressed', 'false'); th.setAttribute('aria-pressed', String(isDark()));
    tm.addEventListener('click', function () {
      var on = document.body.classList.toggle('teacher'); tm.setAttribute('aria-pressed', String(on));
    });

    lk.setAttribute('aria-haspopup', 'listbox'); lk.setAttribute('aria-expanded', 'false');
    lk.addEventListener('click', function () { if (openDd && openDd.t === lk) closeDd(true); else openLook(lk); });

      if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !(openDd && openDd.t === lk)) { e.preventDefault(); openLook(lk); }
    });
    themeBtn = th;
    add(bar, tm, tbtn('print', lab('printStudent'), function () { printAs('student'); }),
      tbtn('printKey', lab('printTeacher'), function () { printAs('teacher'); }), th, lk);
    wrap.appendChild(bar); toolbarEl = bar;
  }
  // Slim stage progress pinned to the top once the hero has scrolled away: one segment per stage, tap to jump.
  function renderStageBar(wrap) {
    if (!(kind === 'lesson' || kind === 'homework' || kind === 'test') || !pkg.sections.length) return;
    var bar = h('nav', 'stagebar'), inner = h('div', 'stagebar-in'), segs = h('div', 'sgs');
    bar.hidden = true; bar.setAttribute('aria-label', lab('stage'));

  function renderFooter(wrap) {
    var bar = h('div', 'savebar'), a = h('a', 'btn primary save-link', lab('saveInMimiao'));

    wrap.appendChild(bar);
  }
  function render(root) {
    var wrap = h('div', 'wrap'), main = h('main'), deco = h('div', 'deco');
    kind = pkg.kind; mainEl = main; renderHeader(wrap); renderStageBar(wrap);
    if (kind === 'game') renderGame(main);
    else if (kind === 'course_plan') renderPlan(main);
    else renderSections(main);
    if (kind !== 'course_plan') renderAnswerKey(main);
    threadEl = svgEl('svg', { 'aria-hidden': 'true', focusable: 'false' });
    threadEl.setAttribute('class', 'thread'); threadEl.appendChild(svgEl('path'));
    main.insertBefore(threadEl, main.firstChild);

    deco.setAttribute('aria-hidden', 'true');
    for (var i = 0; i < 3; i++) deco.appendChild(h('i'));

    window.addEventListener('resize', function () { onScroll(); drawThread(); });

    settle();
  }
  function boot() {
    var root = document.getElementById('app'), html = document.documentElement;
    html.setAttribute('data-preset', 'mimiao');
    var saved = store('mk-theme');
    if (saved === 'light' || saved === 'dark') html.setAttribute('data-theme', saved);
    window.addEventListener('afterprint', function () { document.body.removeAttribute('data-print'); });
    try {
      pkg = JSON.parse(document.getElementById('kit-data').textContent);
      if (!pkg || pkg.mimiaoPackage !== 1) throw new Error('not a package');
      L = pkg.locale === 'en' ? LABELS.en : LABELS.uk;
      var st = pkg.style && typeof pkg.style === 'object' ? pkg.style : {}, chosen = store('mk-look:' + pkg.title);
      if (st.mode === 'light' || st.mode === 'dark') html.setAttribute('data-theme', st.mode); // the package's own mode wins; the toggle can still change it
      applyColours(st);

  }
  boot();
